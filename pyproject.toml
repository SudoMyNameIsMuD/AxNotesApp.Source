[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "AxNotes"
version = "0.1.7"
description = "A simple, local-first, Markdown-authoritative bullet note application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
AxNotes = "AxNotes.cli:main"
axnotes = "AxNotes.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/AxNotes/__init__.py" = ["N999"]
"src/AxNotes/parser.py" = ["PIE810"]